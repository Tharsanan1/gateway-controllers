name: json-schema-guardrail
version: v0.2.0
description: |
  Validate request or response content against a JSON Schema with optional JSONPath extraction and optional inverted validation logic.

parameters:
  type: object
  properties:
    request:
      type: object
      description: Configuration for request phase validation
      properties:
        schema:
          type: string
          description: Provide the JSON Schema as a valid JSON string for validating the extracted or full payload.
        jsonPath:
          type: string
          description: |
            Extract JSON with JSONPath before schema validation.
            Defaults to "$.messages[-1].content" (last message content).
            Set to "" to validate the full payload against the schema.
          default: "$.messages[-1].content"
        invert:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, validation passes when schema validation FAILS (inverted logic).
            If false (default), validation passes when schema validation succeeds.
          default: false
        showAssessment:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, includes detailed validation error information in error responses.
            If false, returns minimal error information.
          default: false
      required:
      - schema
    response:
      type: object
      description: Configuration for response phase validation
      properties:
        schema:
          type: string
          description: Provide the JSON Schema as a valid JSON string for validating the extracted or full payload.
        jsonPath:
          type: string
          description: |
            Extract JSON with JSONPath before schema validation.
            Defaults to "$.choices[0].message.content" (first choice message content).
            Set to "" to validate the full payload against the schema.
          default: "$.choices[0].message.content"
        invert:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, validation passes when schema validation FAILS (inverted logic).
            If false (default), validation passes when schema validation succeeds.
          default: false
        showAssessment:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, includes detailed validation error information in error responses.
            If false, returns minimal error information.
          default: false
      required:
      - schema

systemParameters:         
  type: object
  properties: {}
