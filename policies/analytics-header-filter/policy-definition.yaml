name: analytics-header-filter
version: v0.2.0
description: |
  Filters request and response headers in analytics data using allow or deny modes,
  without modifying headers sent upstream or returned to clients.

parameters:
  type: object
  additionalProperties: false
  properties:
    request:
      type: object
      x-wso2-policy-advanced-param: false
      additionalProperties: false
      description: Specifies request header filtering for analytics.
      properties:
        mode:
          type: string
          x-wso2-policy-advanced-param: false
          description: Specifies whether listed headers are included or excluded.
          enum:
            - allow
            - deny
          default: deny
        headers:
          type: array
          x-wso2-policy-advanced-param: false
          description: Specifies header names to match case-insensitively.
          items:
            type: string
            minLength: 1
            maxLength: 256
          uniqueItems: true
          default: []
      required:
        - mode
    response:
      type: object
      x-wso2-policy-advanced-param: false
      additionalProperties: false
      description: Specifies response header filtering for analytics.
      properties:
        mode:
          type: string
          x-wso2-policy-advanced-param: false
          description: Specifies whether listed headers are included or excluded.
          enum:
            - allow
            - deny
          default: deny
        headers:
          type: array
          x-wso2-policy-advanced-param: false
          description: Specifies header names to match case-insensitively.
          items:
            type: string
            minLength: 1
            maxLength: 256
          uniqueItems: true
          default: []
      required:
        - mode
  anyOf:
    - required: [ request ]
    - required: [ response ]

systemParameters:
  type: object
  properties: {}
