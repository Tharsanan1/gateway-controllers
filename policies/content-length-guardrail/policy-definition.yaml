name: content-length-guardrail
version: v0.2.0
description: |
  Validate content byte lengths in request or response payloads using min/max limits, optional JSONPath extraction, and optional inverted logic.

parameters:
  type: object
  properties:
    request:
      type: object
      x-wso2-policy-advanced-param: false
      description: Configuration for request phase validation
      properties:
        min:
          type: integer
          x-wso2-policy-advanced-param: false
          description: Minimum allowed byte length (inclusive)
          minimum: 0
        max:
          type: integer
          x-wso2-policy-advanced-param: false
          description: Maximum allowed byte length (inclusive)
          minimum: 1
        jsonPath:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            JSONPath expression to extract a specific value from JSON payload.
            If empty, validates the entire payload as a string.
            Examples: "$.messages", "$.data.content", "$.items[0].text"
          default: "$.messages"
        invert:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, validation passes when content length is NOT within the min-max range (inverted logic).
            If false (default), validation passes when content length is within the min-max range.
          default: false
        showAssessment:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, includes detailed assessment information in error responses.
            If false, returns minimal error information.
          default: false
      required:
      - min
      - max
    response:
      type: object
      x-wso2-policy-advanced-param: false
      description: Configuration for response phase validation
      properties:
        min:
          type: integer
          x-wso2-policy-advanced-param: false
          description: Minimum allowed byte length (inclusive)
          minimum: 0
        max:
          type: integer
          x-wso2-policy-advanced-param: false
          description: Maximum allowed byte length (inclusive)
          minimum: 1
        jsonPath:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            JSONPath expression to extract a specific value from JSON payload.
            If empty, validates the entire payload as a string.
            Examples: "$.messages", "$.data.content", "$.items[0].text"
          default: "$.messages"
        invert:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, validation passes when content length is NOT within the min-max range (inverted logic).
            If false (default), validation passes when content length is within the min-max range.
          default: false
        showAssessment:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, includes detailed assessment information in error responses.
            If false, returns minimal error information.
          default: false
      required:
      - min
      - max

systemParameters:         
  type: object
  properties: {}
