name: json-xml-mediation
version: v0.1.0
description: |
  Converts request payloads between JSON and XML

parameters:
  type: object
  additionalProperties: false
  required: ["upstreamFormat"]
  properties:
    upstreamFormat:
      type: string
      x-wso2-policy-advanced-param: false
      description: Defines the payload format the upstream service expects. Requests are converted to this format on the way in, and responses are converted back automatically.
      enum: ["xml", "json"]

systemParameters:
  type: object
  additionalProperties: false
  properties: {}
