name: request-rewrite
version: v0.2.1
description: |
  Rewrite request paths, query parameters, and HTTP methods before forwarding upstream, with optional header and query match conditions to apply rewrites only when criteria are met.

parameters:
  type: object
  additionalProperties: false
  properties:
    match:
      type: object
      x-wso2-policy-advanced-param: true
      description: Apply rewrites only when match conditions pass.
      additionalProperties: false
      properties:
        headers:
          type: array
          x-wso2-policy-advanced-param: true
          description: Match request headers.
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                x-wso2-policy-advanced-param: true
                description: Match header name (case-insensitive).
                minLength: 1
              type:
                type: string
                x-wso2-policy-advanced-param: true
                description: Select header match type.
                enum:
                  - Exact
                  - Regex
                  - Present
              value:
                type: string
                x-wso2-policy-advanced-param: true
                description: Match header value for Exact or Regex.
                minLength: 1
                maxLength: 2048
            required:
              - name
              - type
            allOf:
              - if:
                  properties:
                    type:
                      enum: [Exact, Regex]
                  required: [type]
                then:
                  required: [value]
        queryParams:
          type: array
          x-wso2-policy-advanced-param: true
          description: Match request query parameters.
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                x-wso2-policy-advanced-param: true
                description: Match query parameter name.
                minLength: 1
              type:
                type: string
                x-wso2-policy-advanced-param: true
                description: Select query match type.
                enum:
                  - Exact
                  - Regex
                  - Present
              value:
                type: string
                x-wso2-policy-advanced-param: true
                description: Match parameter value for Exact or Regex.
                minLength: 1
                maxLength: 2048
            required:
              - name
              - type
            allOf:
              - if:
                  properties:
                    type:
                      enum: [Exact, Regex]
                  required: [type]
                then:
                  required: [value]
      minProperties: 1

    pathRewrite:
      type: object
      x-wso2-policy-advanced-param: false
      description: Rewrite request path.
      additionalProperties: false
      properties:
        type:
          type: string
          x-wso2-policy-advanced-param: false
          description: Choose path rewrite mode.
          enum:
            - ReplacePrefixMatch
            - ReplaceFullPath
            - ReplaceRegexMatch
        replacePrefixMatch:
          type: string
          x-wso2-policy-advanced-param: false
          description: Replace matched operation prefix with this path.
          minLength: 1
          maxLength: 2048
          pattern: "^/.*"
        replaceFullPath:
          type: string
          x-wso2-policy-advanced-param: false
          description: Replace full request path with this path.
          minLength: 1
          maxLength: 2048
          pattern: "^/.*"
        replaceRegexMatch:
          type: object
          x-wso2-policy-advanced-param: true
          description: Rewrite path using regex pattern and substitution.
          additionalProperties: false
          properties:
            pattern:
              type: string
              x-wso2-policy-advanced-param: true
              description: Match path using RE2 regex.
              minLength: 1
              maxLength: 1024
            substitution:
              type: string
              x-wso2-policy-advanced-param: true
              description: Replace match using capture groups like \1.
              maxLength: 2048
          required:
            - pattern
            - substitution
      required:
        - type
      allOf:
        - if:
            properties:
              type:
                const: ReplacePrefixMatch
            required: [type]
          then:
            required: [replacePrefixMatch]
        - if:
            properties:
              type:
                const: ReplaceFullPath
            required: [type]
          then:
            required: [replaceFullPath]
        - if:
            properties:
              type:
                const: ReplaceRegexMatch
            required: [type]
          then:
            required: [replaceRegexMatch]

    queryRewrite:
      type: object
      x-wso2-policy-advanced-param: false
      description: Rewrite request query parameters.
      additionalProperties: false
      properties:
        rules:
          type: array
          x-wso2-policy-advanced-param: false
          description: Apply query rewrite rules in order.
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              action:
                type: string
                x-wso2-policy-advanced-param: false
                description: Choose query rewrite action.
                enum:
                  - Replace
                  - Remove
                  - Add
                  - Append
                  - ReplaceRegexMatch
              name:
                type: string
                x-wso2-policy-advanced-param: false
                description: Target query parameter name.
                minLength: 1
              value:
                type: string
                x-wso2-policy-advanced-param: false
                description: Set value for Replace, Add, or Append.
                maxLength: 2048
              separator:
                type: string
                x-wso2-policy-advanced-param: true
                description: Join value for Append.
                default: ""
                maxLength: 64
              pattern:
                type: string
                x-wso2-policy-advanced-param: true
                description: Match value using RE2 regex.
                minLength: 1
                maxLength: 1024
              substitution:
                type: string
                x-wso2-policy-advanced-param: true
                description: Replace value using capture groups like \1.
                maxLength: 2048
            required:
              - action
              - name
            allOf:
              - if:
                  properties:
                    action:
                      enum: [Replace, Add, Append]
                  required: [action]
                then:
                  required: [value]
              - if:
                  properties:
                    action:
                      const: ReplaceRegexMatch
                  required: [action]
                then:
                  required: [pattern, substitution]
      required:
        - rules

    methodRewrite:
      type: string
      x-wso2-policy-advanced-param: false
      description: Rewrite request HTTP method.
      enum:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - HEAD
        - OPTIONS

  anyOf:
    - required: [pathRewrite]
    - required: [queryRewrite]
    - required: [methodRewrite]

systemParameters:
  type: object
  additionalProperties: false
  properties: {}
